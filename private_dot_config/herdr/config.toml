[theme]
name = "terminal"

[theme.custom]
accent = "#7aa2f7"

[ui]
agent_panel_sort = "priority"
prompt_new_workspace_name = true

[keys]
next_tab = "ctrl+n"
previous_tab = "ctrl+p"

[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "y-mitomi.review-bridge.open"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "system"
